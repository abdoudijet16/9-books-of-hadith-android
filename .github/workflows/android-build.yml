name: Android Build

# Builds a debug APK on every push/PR so you can grab it from the
# Actions run's "Artifacts" section without building locally.
#
# No android-actions/setup-android step: GitHub's ubuntu-latest
# runners already ship a full Android SDK preinstalled (ANDROID_HOME
# is already set, sdkmanager is already on PATH), and that action's
# own license/package-install step is currently broken upstream (it
# tries to install a legacy 'tools' package Google removed from the
# repository). Just using the preinstalled SDK avoids the bug entirely.
#
# This project also doesn't commit a Gradle wrapper jar (binary
# file), so this installs a matching Gradle directly instead of
# using ./gradlew.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HadithExplorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
