name: Android Build

# Builds a debug APK on every push/PR so you can grab it from the
# Actions run's "Artifacts" section without building locally.
# This project doesn't commit a Gradle wrapper jar (binary file), so
# the workflow installs a matching Gradle directly instead of using
# ./gradlew — see the "Set up Gradle" step below.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HadithExplorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
