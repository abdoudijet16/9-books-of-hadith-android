plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hadithexplorer'
    compileSdk 34

    defaultConfig {
        applicationId "com.hadithexplorer"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // hadiths.db is a real SQLite file bundled as an asset. Keeping it
    // uncompressed in the APK means it can be opened straight from disk
    // after a plain byte copy on first launch, with no zip-inflate step.
    aaptOptions {
        noCompress "db"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
